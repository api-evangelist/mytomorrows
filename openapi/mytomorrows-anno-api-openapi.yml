openapi: 3.2.0
info:
  title: Enterprise Search Anno API
  version: 0.1.0
tags:
- name: Anno
paths:
  /v01/anno/to_annotate:
    post:
      tags:
      - Anno
      summary: Get Annotations Endpoint
      operationId: get_annotations_endpoint_v01_anno_to_annotate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v01/anno/process:
    post:
      tags:
      - Anno
      summary: Process Annotations Endpoint
      operationId: process_annotations_endpoint_v01_anno_process_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JsonRequest:
      properties: {}
      additionalProperties: true
      type: object
      title: JsonRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
